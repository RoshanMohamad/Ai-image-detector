name: Build and Test API

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-api.txt
        pip install pytest flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 api.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 api.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test API imports (mocked — no model download)
      run: |
        python -c "
        import unittest.mock as mock
        with mock.patch('transformers.pipeline'):
            import api
            print('API module imported successfully')
            assert api.MODEL_NAME == 'umm-maybe/AI-image-detector'
            assert api.MAX_FILE_SIZE == 10 * 1024 * 1024
            print('All import checks passed')
        "
    
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short || echo "No tests found yet"
  
  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t ai-image-detector-api:latest .
    
    - name: Verify Docker image
      run: |
        docker images ai-image-detector-api:latest
        echo "Docker image built successfully"
